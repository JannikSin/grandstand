# Daily data refresh. Each source fails soft inside its script (old data kept,
# meta.json stamped) so one broken feed never blocks the others' commit.
name: update-data

on:
  schedule:
    - cron: "23 10 * * *" # 10:23 UTC daily (~6:23 ET summer); minute offset avoids the :00 herd
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # runner's preinstalled Node is plenty (scripts are zero-dependency)
      - name: Update sources
        run: |
          node scripts/update-f1.mjs
          node scripts/update-purdue.mjs
          node scripts/update-tennis.mjs
      - name: Commit if changed
        run: |
          git config user.name "grandstand-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: daily refresh $(date -u +%F)"
          git push
